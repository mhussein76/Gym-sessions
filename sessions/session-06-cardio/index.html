<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الحصة السادسة - كارديو 03/09/2026</title>
<style>
:root{--bg:#0f1720;--card:#1a2431;--card2:#222f40;--text:#eef3f8;--mute:#9fb0c3;--acc:#ff7a2f;--ok:#2ecc71;--line:#2d3b4e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.55;padding-bottom:110px}
header{padding:22px 16px 12px;max-width:760px;margin:auto}
h1{margin:0 0 4px;font-size:22px}
.sub{color:var(--mute);font-size:14px}
.bar{height:10px;background:var(--card2);border-radius:99px;overflow:hidden;margin-top:14px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--ok));transition:width .3s}
.pct{font-size:13px;color:var(--mute);margin-top:6px}
main{max-width:760px;margin:auto;padding:0 14px}
.sec{margin:26px 0 10px;font-size:15px;color:var(--acc);font-weight:700;letter-spacing:.3px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:14px}
.card.done{border-color:var(--ok)}
.pic{display:block;width:100%;background:#fff;max-height:340px;object-fit:contain;cursor:zoom-in}
.pic.tall{max-height:380px}
.body{padding:14px 14px 16px}
.num{display:inline-block;background:var(--acc);color:#111;font-weight:800;border-radius:8px;padding:0 9px;margin-inline-end:8px;font-size:14px}
.en{font-weight:800;font-size:19px;direction:ltr;text-align:right;margin:0}
.ar{color:var(--mute);font-size:14px;margin:2px 0 10px}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.tag{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:5px 11px;font-size:15px;font-weight:700}
.tag small{display:block;color:var(--mute);font-weight:400;font-size:11px}
ol.steps{margin:10px 0 0;padding-inline-start:22px;font-size:15px}
ol.steps li{margin:3px 0}
.note{background:#2b2a18;border:1px solid #5b5326;color:#f1e3a0;border-radius:10px;padding:8px 11px;font-size:13px;margin-top:10px}
.rounds{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}
.rounds span{color:var(--mute);font-size:13px}
.chip{min-width:52px;height:46px;border-radius:12px;border:2px solid var(--line);background:var(--card2);color:var(--text);font-size:16px;font-weight:800;cursor:pointer}
.chip.on{background:var(--ok);border-color:var(--ok);color:#06210f}
.gif{display:block;width:100%;max-width:360px;margin:8px auto;border-radius:12px}
.gl{font-size:12px;color:var(--mute);margin-top:10px}
.rest{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card2);border:1px dashed var(--acc);border-radius:14px;padding:12px 14px;margin-bottom:14px}
.rest b{font-size:16px}
.btn{background:var(--acc);color:#111;border:0;border-radius:12px;padding:11px 16px;font-size:15px;font-weight:800;cursor:pointer}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.sum{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 14px 12px}
.sum div{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.sum div:last-child{border:0}
.sum em{font-style:normal;direction:ltr;font-weight:700}
.reset{margin:20px 0 0;text-align:center}
#timer{position:fixed;inset-inline:0;bottom:0;background:#101a26ee;backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
#timer .t{font-size:30px;font-weight:800;min-width:76px;text-align:center;direction:ltr;font-variant-numeric:tabular-nums}
#timer.go{background:#14341f}
#timer.end{background:#4a1d12}
#zoom{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;z-index:9;padding:10px}
#zoom img{max-width:100%;max-height:100%;background:#fff;border-radius:8px}
</style>
</head>
<body>
<header>
  <a href="../../" style="color:#9fb0c3;font-size:14px;text-decoration:none">← كل الحصص</a>
  <h1>الحصة السادسة — كارديو</h1>
  <div class="sub">03/09/2026 • دائرة جسم كامل (Metabolic Circuit)</div>
  <div class="bar"><i id="fill"></i></div>
  <div class="pct" id="pct">0%</div>
</header>
<main id="app"></main>

<div id="timer">
  <span class="t" id="tt">00:00</span>
  <button class="btn" data-s="30">راحة 30ث</button>
  <button class="btn" data-s="15">15ث</button>
  <button class="btn" data-s="5">5ث</button>
  <button class="btn ghost" id="tstop">إيقاف</button>
</div>
<div id="zoom"><img alt=""></div>

<script>
const EX=[
{sec:"الإحماء",id:"warm",n:"1",en:"Rowing Machine",ar:"جهاز التجديف",tags:[["5 دقائق","المدة"]],rounds:0,
 steps:["اجلس على الجهاز وقدماك مثبتتان.","ادفع بالرجلين أولًا، ثم اسحب بالظهر، ثم بالذراعين.","ارجع بالعكس: ذراعين، ثم ظهر، ثم ركبتين."]},

{sec:"الدائرة الكبيرة — تتكرر 3 مرات",id:"swing",n:"2",en:"Kettlebell Swing",ar:"أرجحة الكيتل بيل",img:"img/swing.jpg",gif:"img/swing-v2.gif",tags:[["24 كجم","الوزن"],["15","التكرار"]],rounds:3,
 steps:["قدماك بعرض الكتفين، والكيتل بيل أمامك.","اثنِ الحوض للخلف (مثل الجلوس)، والظهر مستقيم.","ادفع الحوض للأمام بقوة، فيطير الكيتل بيل لمستوى الصدر.","الذراعان فقط يوجّهان؛ الحركة من الحوض والرجلين."]},

{id:"snatch",n:"3",en:"Single-Arm Kettlebell Snatch",ar:"خطف الكيتل بيل بذراع واحدة",img:"img/snatch.jpg",gif:"img/snatch.gif",tags:[["12 كجم","الوزن"],["10 يمين + 10 شمال","التكرار"]],rounds:3,
 steps:["ابدأ بوضع نصف جلوس، والوزن بين الرجلين (صورة 1).","ادفع بالرجلين والحوض، ويصعد الوزن قريبًا من الجسم (صورة 2).","ارفع الذراع كاملة فوق الرأس (صورة 3).","أنزله بتحكم، وكرر 10 يمين ثم 10 شمال."],
 note:"الصورة بدمبل، والحركة نفسها بالكيتل بيل."},

{id:"lift",n:"4",en:"Alternating Sandbag Ground-to-Shoulder",ar:"رفع كيس الرمل من الأرض إلى الكتف بالتبادل",img:"img/sandbag-lift.jpg",gif:"img/sandbag-lift.gif",tags:[["44 رطل ≈ 20 كجم","الوزن"],["15","التكرار"]],rounds:3,
 steps:["الكيس يبدأ على الأرض أمامك.","انزل بثني الركبتين والحوض، والصدر مفتوح.","ضُمّ الكيس قريبًا من الجسم.","ادفع بالرجلين والحوض، وارفعه على الكتف الأيمن.","أعده للأرض، ثم ارفعه على الكتف الأيسر.","استمر بالتبادل."],
 note:"المكتوب 44 غالبًا رطل (≈ 20 كجم). نتأكد من وحدة الكيس لاحقًا."},

{id:"run",n:"5",en:"Sandbag Shoulder Carry / Shuttle Run",ar:"جري ترددي بكيس الرمل على الكتف",img:"img/sandbag-run.jpg",gif:"img/sandbag-run.gif",imgClass:"tall",tags:[["≈ 20 كجم","الوزن"],["4 مرات رايح–جاي","العدد"]],rounds:3,
 steps:["الكيس على الكتف، وامسكه بيد أو بيدين.","اجرِ للخط ثم ارجع = مرة واحدة.","4 مرات = 8 أطوال للمكان.","لا تَمِل ناحية الكيس. خطوات قصيرة وهادئة (حماية الركبة)."]},

{rest:"راحة 30 ثانية",s:30},

{id:"lunge",n:"6",en:"Barbell Walking Lunges + Back Squat",ar:"اندفاع بالبار + سكوات",img:"img/lunge.jpg",img2:"img/squat.jpg",gif:"img/lunge.gif",gif2:"img/squat.gif",tags:[["بار فارغ 20 كجم","الوزن"],["3 مرات رايح–جاي","في كل دورة"]],rounds:3,
 steps:["البار على أعلى الظهر.","في الذهاب: امشِ باندفاع يمين وشمال حتى خط النهاية (الصورة الأولى).","في الرجوع: اندفاع يمين + اندفاع شمال، ثم سكوات مرتين (الصورة الثانية).","كرر هكذا حتى خط النهاية."]},

{rest:"راحة 15 ثانية ثم الدورة التالية",s:15},

{sec:"التمرين الأخير",id:"knee",n:"7",en:"Hanging Ab-Strap Knee Raise",ar:"رفع الركبتين أثناء التعلّق بأحزمة البطن",img:"img/knee-raise.jpg",gif:"img/knee-raise.gif",tags:[["100","الإجمالي"],["5 × 20","الدفعات"],["≈ 5 ثوانٍ","الراحة"]],rounds:5,roundLabel:"دفعة",
 steps:["علّق الذراعين في الأحزمة، والجسم ثابت.","ثنِّ الركبتين وارفعهما ناحية الصدر.","انزل ببطء بدون تأرجح.","الجودة أهم من الوصول إلى 100: إذا تأرجح الحوض أو تقوّس الظهر، توقف قليلًا."]}
];

const SUM=[["Kettlebell Swing","45 عدة"],["Kettlebell Snatch","30 يمين + 30 شمال"],["Sandbag Shouldering","45 عدة"],["Sandbag Run","12 مرة رايح–جاي"],["Lunges + Squats","3 مرات رايح–جاي"],["Hanging Knee Raise","100 عدة"]];

let S={};
try{S=JSON.parse(localStorage.getItem("gym-s6")||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem("gym-s6",JSON.stringify(S))}catch(e){}};
const $=(q,r=document)=>r.querySelector(q);
const app=$("#app");

function render(){
  let h="";
  EX.forEach(e=>{
    if(e.rest){h+=`<div class="rest"><b>⏱ ${e.rest}</b><button class="btn" data-s="${e.s}">ابدأ</button></div>`;return}
    if(e.sec)h+=`<div class="sec">${e.sec}</div>`;
    const n=e.rounds, on=(S[e.id]||[]);
    const done=n===0?S[e.id+"_d"]:on.filter(Boolean).length===n;
    h+=`<div class="card ${done?"done":""}" id="c-${e.id}">`;
    if(e.img)h+=`<img class="pic ${e.imgClass||""}" src="${e.img}" alt="${e.en}">`;
    if(e.img2)h+=`<img class="pic" src="${e.img2}" alt="Back Squat" style="border-top:2px solid #ddd">`;
    h+=`<div class="body"><p class="en"><span class="num">${e.n}</span>${e.en}</p><p class="ar">${e.ar}</p>`;
    h+=`<div class="tags">${e.tags.map(t=>`<div class="tag">${t[0]}<small>${t[1]}</small></div>`).join("")}</div>`;
    if(e.gif)h+=`<div class="gl">${e.gif2?"الحركة: Lunge":"الحركة"}</div><img class="gif" src="${e.gif}" alt="${e.en}">`;
    if(e.gif2)h+=`<div class="gl">الحركة: Squat</div><img class="gif" src="${e.gif2}" alt="Squat">`;
    h+=`<ol class="steps">${e.steps.map(s=>`<li>${s}</li>`).join("")}</ol>`;
    if(e.note)h+=`<div class="note">${e.note}</div>`;
    h+=`<div class="rounds"><span>${n?(e.roundLabel||"الدورة")+":":"تم:"}</span>`;
    if(n){for(let i=0;i<n;i++)h+=`<button class="chip ${on[i]?"on":""}" data-id="${e.id}" data-i="${i}">${on[i]?"✓":i+1}</button>`}
    else h+=`<button class="chip ${S[e.id+"_d"]?"on":""}" data-id="${e.id}" data-i="d" style="min-width:90px">${S[e.id+"_d"]?"✓ تم":"تم"}</button>`;
    h+=`</div></div></div>`;
  });
  h+=`<div class="sec">الإجمالي المؤكد</div><div class="sum">${SUM.map(r=>`<div><span>${r[0]}</span><em>${r[1]}</em></div>`).join("")}</div>`;
  h+=`<div class="reset"><button class="btn ghost" id="reset">ابدأ من جديد (مسح العلامات)</button></div>`;
  app.innerHTML=h;
  progress();
}
function progress(){
  let tot=0,d=0;
  EX.forEach(e=>{if(e.rest)return;if(e.rounds===0){tot++;if(S[e.id+"_d"])d++}else{tot+=e.rounds;d+=(S[e.id]||[]).filter(Boolean).length}});
  const p=Math.round(d/tot*100);
  $("#fill").style.width=p+"%";$("#pct").textContent=p+"% — "+d+" من "+tot;
}
app.addEventListener("click",ev=>{
  const c=ev.target.closest(".chip");
  if(c){
    const id=c.dataset.id,i=c.dataset.i;
    if(i==="d")S[id+"_d"]=!S[id+"_d"];
    else{const a=S[id]||[];a[+i]=!a[+i];S[id]=a}
    save();render();return;
  }
  const b=ev.target.closest("[data-s]");if(b){startT(+b.dataset.s);return}
  if(ev.target.id==="reset"){
    const r=ev.target;
    if(r.dataset.sure){S={};save();render()}
    else{r.dataset.sure=1;r.textContent="اضغط مرة ثانية للتأكيد";setTimeout(()=>{r.dataset.sure="";r.textContent="ابدأ من جديد (مسح العلامات)"},3000)}
    return}
  if(ev.target.classList.contains("pic")){const z=$("#zoom");$("img",z).src=ev.target.src;z.style.display="flex"}
});
$("#zoom").onclick=()=>{$("#zoom").style.display="none"};
document.querySelectorAll("#timer [data-s]").forEach(b=>b.onclick=()=>startT(+b.dataset.s));

let T=null,left=0;
const box=$("#timer"),tt=$("#tt");
const fmt=s=>String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
function beep(){try{const a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator();o.connect(a.destination);o.frequency.value=880;o.start();setTimeout(()=>o.stop(),350)}catch(e){}try{navigator.vibrate&&navigator.vibrate(300)}catch(e){}}
function startT(s){
  clearInterval(T);left=s;tt.textContent=fmt(left);box.className="go";
  T=setInterval(()=>{left--;tt.textContent=fmt(Math.max(left,0));
    if(left<=0){clearInterval(T);box.className="end";beep();setTimeout(()=>box.className="",2500)}},1000);
}
$("#tstop").onclick=()=>{clearInterval(T);tt.textContent="00:00";box.className=""};
render();
</script>
</body>
</html>
