<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gym Sessions — جلسات التمرين</title>
<style>
:root{--bg:#0f1720;--card:#1a2431;--card2:#222f40;--text:#eef3f8;--mute:#9fb0c3;--acc:#ff7a2f;--line:#2d3b4e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.6}
.hero{padding:56px 20px 44px;text-align:center;background:radial-gradient(900px 340px at 50% -80px,#2a3c57 0,transparent 70%)}
.hero .badge{display:inline-block;background:var(--acc);color:#111;font-weight:800;border-radius:999px;padding:4px 14px;font-size:13px}
.hero h1{margin:16px 0 8px;font-size:34px;line-height:1.25}
.hero h1 span{color:var(--acc)}
.hero p{margin:0 auto;max-width:520px;color:var(--mute);font-size:16px}
.feats{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:26px auto 0;max-width:620px}
.feats div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 14px;font-size:14px}
main{max-width:760px;margin:0 auto;padding:10px 16px 60px}
h2{font-size:18px;color:var(--acc);margin:10px 0 14px}
.grid{display:grid;gap:14px}
.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;color:inherit;text-decoration:none;transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-2px);border-color:var(--acc)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tag{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:2px 10px;font-size:12px;color:var(--mute);direction:ltr}
.date{color:var(--mute);font-size:14px;direction:ltr}
.card h3{margin:10px 0 4px;font-size:20px}
.card p{margin:0;color:var(--mute);font-size:14px}
.go{display:inline-block;margin-top:14px;background:var(--acc);color:#111;font-weight:800;border-radius:12px;padding:9px 18px;font-size:15px}
.meta{color:var(--mute);font-size:13px;margin-top:10px}
.empty{color:var(--mute);text-align:center;padding:30px}
footer{text-align:center;color:var(--mute);font-size:13px;padding:24px 16px 40px;border-top:1px solid var(--line)}
</style>
</head>
<body>
<section class="hero">
  <span class="badge">GYM SESSIONS</span>
  <h1>جلسات <span>التمرين</span></h1>
  <p>كل حصة في صفحة واحدة: التمارين، الأوزان، العدّات، وطريقة الحركة والعضلات العاملة.</p>
  <div class="feats">
    <div>✅ علّم كل دورة تخلصها</div>
    <div>⏱ عدّاد راحة</div>
    <div>🎞 حركة متحركة لكل تمرين</div>
    <div>📱 يعمل على الموبايل</div>
  </div>
</section>
<main>
  <h2>الحصص</h2>
  <div class="grid" id="list"><div class="empty">جاري التحميل...</div></div>
</main>
<footer>Gym Sessions</footer>
<script>
fetch("sessions.json").then(r=>r.json()).then(list=>{
  const el=document.getElementById("list");
  if(!list.length){el.innerHTML='<div class="empty">لا توجد حصص بعد.</div>';return}
  el.innerHTML=list.slice().reverse().map(s=>`
    <a class="card" href="${s.path}">
      <div class="top"><span class="tag">${s.type}</span><span class="date">${s.date}</span></div>
      <h3>${s.title}</h3>
      <p>${s.summary}</p>
      <div class="meta">${s.exercises} تمارين</div>
      <span class="go">افتح الحصة ←</span>
    </a>`).join("");
}).catch(()=>{document.getElementById("list").innerHTML='<div class="empty">تعذر تحميل الحصص.</div>'});
</script>
</body>
</html>
